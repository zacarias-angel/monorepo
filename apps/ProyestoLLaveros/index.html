<!DOCTYPE html>
<html>
  <head>
    <title>Llavero WebAR</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.4/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #ar-container { width: 100%; height: 100vh; position: fixed; top: 0; left: 0; }
    </style>
    <style>
  canvas {
    touch-action: none;
  }
</style>
  </head>
  <body>
    <div id="ar-container">
      <a-scene
        mindar-image="imageTargetSrc: ./targets.mind;"
        color-space="sRGB"
        renderer="colorManagement: true"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false"
        embedded
      >
        <a-entity mindar-image-target="targetIndex: 0" id="target">
          <a-obj-model
            id="modelo3d"
            src="./modelo.obj"
            mtl="./modelo.mtl"
            position="0 0 0.02"
            rotation="0 180 0"
            scale="0.12 0.12 0.12"
            unlit-textured-model
          ></a-obj-model>
        </a-entity>

       <a-camera
  position="0 0 0"
  look-controls-enabled="false"
  wasd-controls-enabled="false"
  touch-enabled="false"
></a-camera>
      </a-scene>
    </div>

    <script>
      AFRAME.registerComponent('unlit-textured-model', {
        init: function () {
          const el = this.el;
          el.addEventListener('model-loaded', function () {
            el.object3D.traverse(function (node) {
              if (!node.isMesh) return;
              const makeUnlit = function (source) {
                return new THREE.MeshBasicMaterial({
                  map: source.map || null,
                  color: source.color || 0xffffff,
                  transparent: source.transparent,
                  opacity: source.opacity,
                  side: source.side
                });
              };
              node.material = Array.isArray(node.material)
                ? node.material.map(makeUnlit)
                : makeUnlit(node.material);
            });
          });
        }
      });
    </script>
  </body>
</html>
