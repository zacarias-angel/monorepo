<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <title>Llavero WebAR | MVP 1</title>
  </head>
  <body>
    <main id="app">
      <section id="intro" class="intro" aria-labelledby="intro-title">
        <div class="intro__card">
          <p class="intro__eyebrow">LLAVERO WEBAR</p>
          <h1 id="intro-title">Tu avatar cobra vida.</h1>
          <p>Esta experiencia usa la camara para reconocer la imagen del llavero y renderizar el modelo 3D sobre ella.</p>
          <p class="intro__hint">Necesitaras permitir el acceso a la camara.</p>
          <button id="start-button" type="button">Iniciar experiencia</button>
        </div>
      </section>
      <section class="hud" aria-live="polite">
        <p class="hud__eyebrow">LLAVERO WEBAR / MVP 1</p>
        <p id="status" class="hud__status">Cámara sin iniciar</p>
        <dl class="hud__metrics">
          <div><dt>Tracking</dt><dd id="tracking-status">PREPARADO</dd></div>
          <div><dt>FPS</dt><dd id="fps">--</dd></div>
          <div><dt>Target</dt><dd id="target-visible">NO</dd></div>
          <div><dt>Confianza</dt><dd id="confidence">--</dd></div>
        </dl>
      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
